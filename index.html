<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кирилл Лопушков</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 50px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }

        .avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .info {
            color: #666;
            font-size: 16px;
            line-height: 1.8;
        }

        .info p {
            margin-bottom: 8px;
        }

        .social-links {
            margin-top: 30px;
            display: flex;
            justify-content: center;
       

gap: 16px;
        }

        .social-links a {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .social-links a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">👨‍💻</div>
        <h1>Кирилл Лопушков</h1>
        <p class="subtitle">Программист | Студент</p>
        <div class="info">
            <p>📍 Химки, Московская область</p>
            <p>🐍 Python разработчик</p>
            <p>🎓 Ученик Kodland</p>
            <p>💡 Создаю ботов и веб-сайты</p>
        </div>
        <div class="social-links">
            <a href="https://github.com" target="_blank">GitHub</a>
            <a href="https://t.me" target="_blank">Telegram</a>
        </div>
    </div>
</body>
</html>
